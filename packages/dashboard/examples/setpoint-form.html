<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Room temperature</title>

    <script>
      document.documentElement.dataset.theme =
        new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
    </script>

    <style>
      :root {
        --bg: #ffffff;
        --fg: #182733;
        --muted: #6b6b76;
        --line: #d4d4d8;
        --error: #b91c1c;
        --ok: #15803d;
      }
      :root[data-theme="dark"] {
        --bg: #0b0b0c;
        --fg: #f4f4f5;
        --muted: #8b8b95;
        --line: #3f3f46;
        --error: #f87171;
        --ok: #4ade80;
      }
      body {
        margin: 48px;
        background: var(--bg);
        color: var(--fg);
        font:
          18px/1.5 system-ui,
          sans-serif;
      }
      input,
      button {
        font: inherit;
        padding: 10px;
        color: inherit;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      input {
        width: 6ch;
        margin-left: 8px;
      }
      button {
        margin-left: 8px;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
      #feedback {
        min-height: 2em;
      }
      #feedback[data-kind="error"] {
        color: var(--error);
      }
      #feedback[data-kind="ok"] {
        color: var(--ok);
      }
    </style>
  </head>
  <body>
    <!--
      The Analysis is the one from the docs.tago.io recipe "Validate a Custom Dashboard form":
      https://docs.tago.io/docs/tagoio/analysis/endpoints/recipes/validate-dashboard-form
      It answers POST /setpoint with 200 and { ok, setpoint } when the value is from 5 to 30, and with
      422 and { errors: { setpoint } } otherwise. A Run user needs Call Endpoint on that Analysis.
    -->
    <h1>Room temperature</h1>
    <form id="settings" novalidate>
      <label>Setpoint (5 to 30 C)<input name="setpoint" value="22" aria-describedby="feedback" /></label>
      <!-- type="button": the dashboard frame blocks native form submission, so a submit event never fires. -->
      <button id="save" type="button">Save setpoint</button>
    </form>
    <p id="feedback" role="status"></p>

    <script src="../dist/custom-dashboard.min.js"></script>
    <script>
      // The ID of the Analysis, the 24 characters at the end of its Endpoint URL.
      var ANALYSIS_ID = "YOUR_ANALYSIS_ID";

      var form = document.getElementById("settings");
      var save = document.getElementById("save");
      var feedback = document.getElementById("feedback");

      // Server text goes through textContent, never innerHTML.
      function show(text, kind) {
        feedback.dataset.kind = kind;
        feedback.textContent = text;
      }

      // The body is whatever the Analysis answered, or the platform's own error, so read it defensively.
      function readBody(answer) {
        return answer.body && typeof answer.body === "object" ? answer.body : {};
      }

      save.addEventListener("click", function () {
        save.disabled = true;
        show("Saving...", "pending");

        TagoDashboard.endpoint
          .call(ANALYSIS_ID, {
            method: "POST",
            path: "/setpoint",
            body: { setpoint: form.elements.setpoint.value },
          })
          .then(
            function (answer) {
              // Every HTTP status resolves, so check it before reading the body.
              var body = readBody(answer);
              if (answer.status === 422) {
                show((body.errors && body.errors.setpoint) || "Invalid setpoint.", "error");
              } else if (answer.status >= 400) {
                show(body.error || "Request failed (" + answer.status + ").", "error");
              } else {
                show("Saved: " + body.setpoint + " C", "ok");
              }
            },
            function (error) {
              // The call did not complete. After no_response, aborted or api_error the Analysis may still have
              // run, so do not retry on your own: read the value back, or let the user decide.
              show("Not completed (" + error.code + "): " + error.message, "error");
            }
          )
          .finally(function () {
            save.disabled = false;
          });
      });

      TagoDashboard.theme.subscribe(function () {
        document.documentElement.dataset.theme = TagoDashboard.theme.get();
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Link parameters</title>

    <script>
      document.documentElement.dataset.theme =
        new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
    </script>

    <style>
      :root {
        --bg: #ffffff;
        --fg: #111114;
        --muted: #6b6b76;
        --line: #e4e4e7;
      }
      :root[data-theme="dark"] {
        --bg: #0b0b0c;
        --fg: #f4f4f5;
        --muted: #8b8b95;
        --line: #27272a;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .error {
        color: #dc2626;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 16px;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <!--
      Open this dashboard from a link such as /dashboards/<id>?device=<device id>. The host forwards
      that querystring, and this page scopes its query to the device. Change the URL without a
      reload and the page follows.
    -->
    <h2>Link parameters</h2>
    <p id="status" class="muted">Waiting for the dashboard host.</p>
    <table>
      <thead>
        <tr>
          <th>Key</th>
          <th>Value</th>
        </tr>
      </thead>
      <tbody id="params"></tbody>
    </table>
    <p id="result" class="muted"></p>

    <script src="../dist/custom-dashboard.min.js"></script>
    <script>
      // A saved TagoSQL query whose $1 is a device id. Leave it empty to only list the parameters.
      var QUERY_ID = "";

      var statusLine = document.getElementById("status");
      var body = document.getElementById("params");
      var result = document.getElementById("result");
      var updates = 0;

      // Server and URL text goes through textContent, never innerHTML.
      function cell(text) {
        var td = document.createElement("td");
        td.textContent = text;
        return td;
      }

      function render() {
        var params = TagoDashboard.params.get();
        var keys = Object.keys(params);

        body.replaceChildren();
        for (var i = 0; i < keys.length; i += 1) {
          var row = document.createElement("tr");
          row.append(cell(keys[i]), cell(params[keys[i]]));
          body.append(row);
        }
        statusLine.textContent =
          keys.length === 0 ? "No parameters on the link." : keys.length + " parameters, update " + updates + ".";

        if (!QUERY_ID) {
          result.textContent = "";
          return;
        }
        if (!params.device) {
          result.textContent = "Add ?device=<id> to the link to scope the query.";
          return;
        }

        result.textContent = "Running the query for " + params.device + ".";
        TagoDashboard.sql.run(QUERY_ID, [{ key: "$1", value: params.device }]).then(
          function (data) {
            result.textContent = data.rows.length + " rows for " + params.device + ".";
          },
          function (error) {
            result.className = "error";
            result.textContent = error.message;
          }
        );
      }

      TagoDashboard.theme.subscribe(function () {
        document.documentElement.dataset.theme = TagoDashboard.theme.get();
      });
      TagoDashboard.params.subscribe(function () {
        updates += 1;
        render();
      });
      render();
    </script>
  </body>
</html>

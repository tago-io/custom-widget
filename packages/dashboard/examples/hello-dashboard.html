<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hello dashboard</title>

    <!--
      The theme is on the shell URL, so setting it here paints the right colors on the very
      first frame instead of flashing. The SDK reports the theme; applying it is yours.
    -->
    <script>
      document.documentElement.dataset.theme =
        new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
    </script>

    <style>
      :root {
        --bg: #ffffff;
        --fg: #111114;
        --muted: #6b6b76;
        --line: #e4e4e7;
        --accent: #2cb1bc;
      }
      :root[data-theme="dark"] {
        --bg: #0b0b0c;
        --fg: #f4f4f5;
        --muted: #8b8b95;
        --line: #27272a;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      select,
      button {
        font: inherit;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
      }
      button {
        cursor: pointer;
        border-color: var(--accent);
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
        border-color: var(--line);
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .error {
        color: #dc2626;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
      }
      th {
        font-size: 12px;
        color: var(--muted);
      }
    </style>

    <!-- Swap this for the contents of dist/custom-dashboard.min.js to get one uploadable file. -->
    <script src="../dist/custom-dashboard.min.js"></script>
  </head>

  <body>
    <header>
      <select id="picker" disabled>
        <option value="">Loading queries…</option>
      </select>
      <button id="run" disabled>Run</button>
      <span class="muted" id="status"></span>
    </header>

    <p class="error" id="error" hidden></p>
    <table>
      <thead id="head"></thead>
      <tbody id="body"></tbody>
    </table>

    <script>
      var picker = document.getElementById("picker");
      var runButton = document.getElementById("run");
      var statusText = document.getElementById("status");
      var errorText = document.getElementById("error");
      var head = document.getElementById("head");
      var body = document.getElementById("body");

      function applyTheme() {
        document.documentElement.dataset.theme = TagoDashboard.theme.get();
      }
      applyTheme();
      TagoDashboard.theme.subscribe(applyTheme);

      function showError(error) {
        // `bad_params` covers timeouts, rate limits and plan limits too, so the server's own
        // message is the only reliable detail. textContent, never innerHTML: it is API text.
        var hint =
          error.code === "not_found"
            ? "That saved query no longer exists."
            : error.code === "forbidden"
              ? "You do not have access to this query's resource."
              : error.code === "no_host"
                ? "Open this page inside a TagoIO Custom Dashboard."
                : error.code === "no_response"
                  ? "The dashboard did not answer. Try again."
                  : error.message;

        errorText.textContent = hint + " (" + error.code + ")";
        errorText.hidden = false;
      }

      function clearError() {
        errorText.hidden = true;
        errorText.textContent = "";
      }

      function renderTable(result) {
        head.textContent = "";
        body.textContent = "";

        var headRow = document.createElement("tr");
        result.columns.forEach(function (column) {
          var th = document.createElement("th");
          th.textContent = column;
          headRow.appendChild(th);
        });
        head.appendChild(headRow);

        result.rows.forEach(function (row) {
          var tr = document.createElement("tr");
          result.columns.forEach(function (column) {
            var td = document.createElement("td");
            var value = row[column];
            td.textContent = value === null || value === undefined ? "—" : String(value);
            tr.appendChild(td);
          });
          body.appendChild(tr);
        });

        statusText.textContent =
          result.rows.length +
          " rows · " +
          (result.meta.execution_ms === null ? "?" : result.meta.execution_ms) +
          " ms" +
          (result.meta.served_from_cache ? " · cached" : "");
      }

      async function run() {
        if (!picker.value) return;
        clearError();
        runButton.disabled = true;
        statusText.textContent = "Running…";

        try {
          // No params here: every stored default of the saved query applies.
          renderTable(await TagoDashboard.sql.run(picker.value));
        } catch (error) {
          statusText.textContent = "";
          showError(error);
        } finally {
          runButton.disabled = false;
        }
      }

      runButton.addEventListener("click", run);
      picker.addEventListener("change", run);

      TagoDashboard.sql
        .list()
        .then(function (queries) {
          picker.textContent = "";

          if (queries.length === 0) {
            picker.appendChild(new Option("No saved queries in this profile", ""));
            return;
          }

          picker.appendChild(new Option("Pick a query…", ""));
          queries.forEach(function (query) {
            picker.appendChild(new Option(query.name, query.id));
          });
          picker.disabled = false;
          runButton.disabled = false;
        })
        .catch(function (error) {
          picker.textContent = "";
          picker.appendChild(new Option("Could not load queries", ""));
          showError(error);
        });
    </script>
  </body>
</html>

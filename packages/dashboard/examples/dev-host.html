<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dev host — develop a shell without uploading</title>
    <style>
      body {
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
        font:
          13px/1.5 system-ui,
          sans-serif;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid #e4e4e7;
      }
      input {
        flex: 1;
        font: inherit;
        padding: 4px 8px;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <header>
      <label for="src">Shell</label>
      <input id="src" value="./hello-dashboard.html" />
      <label for="theme">Theme</label>
      <select id="theme">
        <option value="light">light</option>
        <option value="dark">dark</option>
      </select>
      <label for="params">Link params</label>
      <input id="params" value="device=abc123" placeholder="device=abc123&amp;from=2026-01-01" />
      <button id="reload">Reload</button>
    </header>

    <iframe id="shell"></iframe>

    <script>
      // Guard against a double install under HMR, which would answer every request twice.
      if (!window.__tagoDevHostInstalled) {
        window.__tagoDevHostInstalled = true;

        var QUERIES = [
          { id: "aaaaaaaaaaaaaaaaaaaaaaaa", name: "devices (mock)" },
          { id: "bbbbbbbbbbbbbbbbbbbbbbbb", name: "readings (mock)" },
        ];

        // One Endpoint that answers like the docs.tago.io recipe "Validate a Custom Dashboard form".
        var ENDPOINTS = [{ id: "cccccccccccccccccccccccc", name: "Save setpoint (mock)" }];
        var METHODS = ["GET", "POST", "PUT", "PATCH", "DELETE"];

        var shell = document.getElementById("shell");
        var themeSelect = document.getElementById("theme");
        var srcInput = document.getElementById("src");
        var paramsInput = document.getElementById("params");

        // Keys the real host keeps for itself and never forwards. Mirrors
        // CUSTOM_DASHBOARD_RESERVED_PARAM_KEYS in tago-io/admin packages/dashboard/custom-dashboard/params.ts.
        var RESERVED_PARAMS = [
          "tab",
          "tabKey",
          "edit",
          "panel",
          "dialog",
          "period_start",
          "period_end",
          "prompt",
          "user",
          "anonymousToken",
          "by_token",
          "byToken",
          "bytoken",
          "redirect_to",
          "redirect",
          "debug_url",
          "local_login",
        ];

        // What the real host forwards: the parent querystring minus its own keys and empty values.
        function readParams() {
          var params = {};
          new URLSearchParams(paramsInput.value).forEach(function (value, key) {
            if (value !== "" && RESERVED_PARAMS.indexOf(key) === -1) params[key] = value;
          });
          return params;
        }

        function reply(message) {
          shell.contentWindow.postMessage(message, "*");
        }

        function mockRows(queryID, params) {
          return {
            columns: ["id", "name", "params_seen"],
            rows: [
              { id: queryID, name: "mock row 1", params_seen: JSON.stringify(params ?? []) },
              { id: queryID, name: "mock row 2", params_seen: JSON.stringify(params ?? []) },
            ],
            row_count: 2,
            execution_ms: 7,
            served_from_cache: false,
          };
        }

        function endpointAnswer(status, body) {
          return { status: status, headers: { "content-type": "application/json" }, body: body };
        }

        // The real host refuses these before it calls anything, as a bridge error rather than an HTTP status.
        function isRefusedByHost(call) {
          var method = String(call.method || "GET").toUpperCase();
          var segments = String(call.path || "").split("/");
          return (
            !/^[a-z0-9]{24}$/i.test(call.endpoint_id) ||
            METHODS.indexOf(method) === -1 ||
            (method === "GET" && call.body !== undefined) ||
            segments.indexOf(".") !== -1 ||
            segments.indexOf("..") !== -1
          );
        }

        // The recipe's Analysis: POST /setpoint saves a number from 5 to 30 and answers 422 for anything else.
        function answerAsRecipe(call) {
          var known = ENDPOINTS.some(function (endpoint) {
            return endpoint.id === call.endpoint_id;
          });
          // An Endpoint the viewer may not call answers 404, as an HTTP status, not as a bridge error.
          if (!known) return endpointAnswer(404, { message: "Endpoint can't be found", status: false });

          var method = String(call.method || "GET").toUpperCase();
          var path = "/" + String(call.path || "").replace(/^\/+/, "");
          if (method !== "POST" || path !== "/setpoint") return endpointAnswer(404, { error: "Not found." });

          // A missing or empty value reads as 0 here, which is out of range, as Luau's tonumber makes it nil there.
          var setpoint = Number(call.body?.setpoint);
          if (!(setpoint >= 5 && setpoint <= 30)) {
            return endpointAnswer(422, { errors: { setpoint: "Enter a number from 5 to 30." } });
          }
          return endpointAnswer(200, { ok: true, setpoint: setpoint });
        }

        window.addEventListener("message", function (event) {
          var data = event.data;
          if (!data || typeof data !== "object") return;

          if (data.type === "dashboard:ready") {
            reply({ type: "dashboard:theme", theme: themeSelect.value });
            reply({ type: "dashboard:style", style: {} });
            // Like the real host, send params on ready only when there is something to forward.
            var params = readParams();
            if (Object.keys(params).length > 0) reply({ type: "dashboard:params", params: params });
            return;
          }

          if (data.type !== "dashboard:request") return;

          // The real host drops a request with no id and never answers. Mirror that, or you
          // will not notice the bug until you upload.
          if (typeof data.id !== "string" || data.id.length === 0) return;

          if (data.op === "sql.list") {
            reply({ type: "dashboard:response", id: data.id, ok: true, result: { queries: QUERIES } });
            return;
          }

          if (data.op === "sql.run") {
            var payload = data.payload ?? {};
            var known = QUERIES.some(function (query) {
              return query.id === payload.query_id;
            });

            reply(
              known
                ? {
                    type: "dashboard:response",
                    id: data.id,
                    ok: true,
                    result: mockRows(payload.query_id, payload.params),
                  }
                : {
                    type: "dashboard:response",
                    id: data.id,
                    ok: false,
                    error: { code: "not_found", message: "SQL query can't be found" },
                  }
            );
            return;
          }

          if (data.op === "endpoint.list") {
            reply({ type: "dashboard:response", id: data.id, ok: true, result: { endpoints: ENDPOINTS } });
            return;
          }

          if (data.op === "endpoint.call") {
            var call = data.payload ?? {};
            reply(
              isRefusedByHost(call)
                ? {
                    type: "dashboard:response",
                    id: data.id,
                    ok: false,
                    error: { code: "bad_request", message: "Invalid endpoint.call payload" },
                  }
                : { type: "dashboard:response", id: data.id, ok: true, result: answerAsRecipe(call) }
            );
            return;
          }

          reply({
            type: "dashboard:response",
            id: data.id,
            ok: false,
            error: { code: "unknown_op", message: "Unknown op: " + data.op },
          });
        });

        function load() {
          // Anything that reaches an iframe src is a javascript: sink, so resolve the typed
          // path and refuse a non-http(s) scheme before assigning it.
          var target;
          try {
            target = new URL(srcInput.value, location.href);
          } catch (error) {
            return;
          }
          if (target.protocol !== "http:" && target.protocol !== "https:") {
            return;
          }

          // The real shell URL carries the theme, and shells are expected to read it.
          target.searchParams.set("theme", themeSelect.value);
          target.searchParams.set("v", "1");
          shell.src = target.href;
        }

        document.getElementById("reload").addEventListener("click", load);
        themeSelect.addEventListener("change", function () {
          reply({ type: "dashboard:theme", theme: themeSelect.value });
        });
        // A change here stands in for the parent URL changing without a reload.
        paramsInput.addEventListener("change", function () {
          reply({ type: "dashboard:params", params: readParams() });
        });

        load();
      }
    </script>
  </body>
</html>

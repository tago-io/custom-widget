<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read Resource Widget</title>
    <script type="text/javascript" src="https://admin.tago.io/dist/custom-widget.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .status {
        padding: 10px;
        margin: 10px 0;
        background: #f0f0f0;
      }
      .error {
        color: red;
        padding: 10px;
        border: 1px solid red;
        margin: 10px 0;
      }
      .group {
        border: 1px solid #ddd;
        border-radius: 4px;
        margin: 12px 0;
      }
      .group-header {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        background: #f5f5f5;
      }
      .group-type {
        text-transform: uppercase;
        font-size: 12px;
        color: #8a4b9c;
      }
      .group-count {
        margin-left: auto;
        font-size: 12px;
        color: #777;
      }
      .request {
        font-size: 13px;
        color: #555;
        padding: 8px 12px;
      }
      .item {
        border: 1px solid #eee;
        border-radius: 3px;
        padding: 8px;
        margin: 6px 12px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Read Resource Widget</h1>
    <p>Reads platform resources (device list, users, entities, entity lists) from the realtime channel.</p>
    <p>For widget config / user info / blueprint devices, see <code>read-widget-info.html</code>.</p>

    <div id="status" class="status">Waiting for data...</div>
    <button type="button" onclick="window.TagoIO.refreshResources()">Refresh resources</button>
    <div id="error" class="error" style="display: none"></div>
    <div id="resources"></div>

    <script>
      /**
       * Read Resource Example
       * Resource blocks arrive on onRealtime carrying a `resource` descriptor instead of `data`.
       * We keep only those blocks and render each collection.
       */

      let updateCount = 0;

      function formatValue(value) {
        if (value === null || value === undefined) return String(value);
        if (typeof value === "object") return JSON.stringify(value);
        return String(value);
      }

      function addRow(parent, label, value) {
        const div = document.createElement("div");
        const strong = document.createElement("strong");
        strong.textContent = `${label}: `;
        div.appendChild(strong);
        div.appendChild(document.createTextNode(value));
        parent.appendChild(div);
      }

      function renderRequest(resource) {
        const wrapper = document.createElement("div");
        wrapper.className = "request";
        if (resource.id) addRow(wrapper, "id", resource.id);
        if (resource.index) addRow(wrapper, "index", resource.index);
        if (Array.isArray(resource.view) && resource.view.length) addRow(wrapper, "view", resource.view.join(", "));
        if (Array.isArray(resource.editable) && resource.editable.length) {
          addRow(wrapper, "editable", resource.editable.join(", "));
        }
        if (resource.filter !== undefined && resource.filter !== null) {
          addRow(wrapper, "filter", formatValue(resource.filter));
        }
        if (resource.amount != null) addRow(wrapper, "amount", String(resource.amount));
        if (resource.orderBy) addRow(wrapper, "orderBy", resource.orderBy);
        return wrapper;
      }

      function renderGroup(group, position) {
        const resource = group.resource;
        const result = Array.isArray(group.result) ? group.result : [];

        const section = document.createElement("section");
        section.className = "group";

        const header = document.createElement("div");
        header.className = "group-header";
        const title = document.createElement("strong");
        title.textContent = `Group #${position + 1}`;
        header.appendChild(title);
        const type = document.createElement("span");
        type.className = "group-type";
        type.textContent = resource.type || "unknown";
        header.appendChild(type);
        const count = document.createElement("span");
        count.className = "group-count";
        count.textContent = `${result.length} item${result.length === 1 ? "" : "s"}`;
        header.appendChild(count);
        section.appendChild(header);

        section.appendChild(renderRequest(resource));

        result.forEach(function (item) {
          const itemDiv = document.createElement("div");
          itemDiv.className = "item";
          Object.keys(item).forEach(function (key) {
            addRow(itemDiv, key, formatValue(item[key]));
          });
          section.appendChild(itemDiv);
        });

        return section;
      }

      window.TagoIO.onStart(function (widget) {
        console.log("Read Resource Widget started:", widget);
        document.getElementById("status").textContent = "Widget started, waiting for resources...";
      });

      window.TagoIO.onRealtime(function (data) {
        console.log("Real-time data received:", data);
        updateCount++;

        const groups = (Array.isArray(data) ? data : []).filter(function (group) {
          return group && group.resource;
        });

        document.getElementById("status").textContent =
          `Updates received: ${updateCount} · ${groups.length} resource group${groups.length === 1 ? "" : "s"}`;

        const container = document.getElementById("resources");
        container.textContent = "";

        if (groups.length === 0) {
          const empty = document.createElement("p");
          empty.textContent = "No resource groups in the last payload.";
          container.appendChild(empty);
          return;
        }

        groups.forEach(function (group, position) {
          container.appendChild(renderGroup(group, position));
        });
      });

      window.TagoIO.onError(function (error) {
        console.error("Widget error:", error);
        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent = "Error: " + (error.message || "Unknown error");
      });

      window.TagoIO.ready({
        header: { color: "#8a4b9c" },
      });
    </script>
  </body>
</html>

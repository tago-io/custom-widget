<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read Resource Widget</title>
    <script type="text/javascript" src="https://admin.tago.io/dist/custom-widget.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .info-section {
        margin: 20px 0;
        padding: 15px;
        background: #f9f9f9;
        border: 1px solid #ddd;
      }
      .error {
        color: red;
        padding: 10px;
        border: 1px solid red;
        margin: 10px 0;
      }
      button {
        padding: 8px 12px;
        margin: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Read Resource Widget</h1>
    <p>Demonstrates accessing TagoIO platform resources and user information.</p>

    <div id="error" class="error" style="display: none"></div>

    <div class="info-section">
      <h3>User Information</h3>
      <div id="user-info">Loading user information...</div>
      <button onclick="refreshUserInfo()">Refresh User Info</button>
    </div>

    <div class="info-section">
      <h3>Blueprint Devices</h3>
      <div id="blueprint-info">Loading blueprint information...</div>
      <button onclick="refreshBlueprints()">Refresh Blueprints</button>
    </div>

    <div class="info-section">
      <h3>Widget Configuration</h3>
      <div id="widget-config">Loading widget configuration...</div>
    </div>

    <script>
      /**
       * Read Resource Example
       * Demonstrates accessing platform resources using onSyncUserInformation and onSyncBlueprintDevices
       */

      let userInfo = null;
      let blueprintDevices = null;
      let widgetConfig = null;

      // Handle widget startup
      window.TagoIO.onStart(function (widget) {
        console.log("Resource Reader Widget started:", widget);
        widgetConfig = widget;
        displayWidgetConfig(widget);
      });

      // Handle user information sync
      window.TagoIO.onSyncUserInformation(function (userData) {
        console.log("User information received:", userData);
        userInfo = userData;
        displayUserInfo(userData);
      });

      // Handle blueprint devices sync
      window.TagoIO.onSyncBlueprintDevices(function (devices) {
        console.log("Blueprint devices received:", devices);
        blueprintDevices = devices;
        displayBlueprintInfo(devices);
      });

      // Display widget configuration
      function displayWidgetConfig(widget) {
        const configDiv = document.getElementById("widget-config");
        configDiv.textContent = "";

        // Create elements instead of using innerHTML
        const widgetIdP = document.createElement("p");
        const widgetIdStrong = document.createElement("strong");
        widgetIdStrong.textContent = "Widget ID: ";
        widgetIdP.appendChild(widgetIdStrong);
        widgetIdP.appendChild(document.createTextNode(widget.id));
        configDiv.appendChild(widgetIdP);

        const dashboardIdP = document.createElement("p");
        const dashboardIdStrong = document.createElement("strong");
        dashboardIdStrong.textContent = "Dashboard ID: ";
        dashboardIdP.appendChild(dashboardIdStrong);
        dashboardIdP.appendChild(document.createTextNode(widget.dashboard));
        configDiv.appendChild(dashboardIdP);

        const labelP = document.createElement("p");
        const labelStrong = document.createElement("strong");
        labelStrong.textContent = "Widget Label: ";
        labelP.appendChild(labelStrong);
        labelP.appendChild(document.createTextNode(widget.label || "No label"));
        configDiv.appendChild(labelP);

        const variablesCountP = document.createElement("p");
        const variablesCountStrong = document.createElement("strong");
        variablesCountStrong.textContent = "Variables Count: ";
        variablesCountP.appendChild(variablesCountStrong);
        variablesCountP.appendChild(document.createTextNode(widget.display.variables.length));
        configDiv.appendChild(variablesCountP);

        const variablesP = document.createElement("p");
        const variablesStrong = document.createElement("strong");
        variablesStrong.textContent = "Variables:";
        variablesP.appendChild(variablesStrong);
        configDiv.appendChild(variablesP);

        const variablesList = document.createElement("ul");
        widget.display.variables.forEach((v) => {
          const li = document.createElement("li");
          li.textContent = `${v.variable} (Device: ${v.origin.id})`;
          variablesList.appendChild(li);
        });
        configDiv.appendChild(variablesList);
      }

      // Display user information
      function displayUserInfo(userData) {
        const userDiv = document.getElementById("user-info");
        if (userData && userData.profile) {
          userDiv.textContent = "";

          // Create elements instead of using innerHTML
          const userIdP = document.createElement("p");
          const userIdStrong = document.createElement("strong");
          userIdStrong.textContent = "User ID: ";
          userIdP.appendChild(userIdStrong);
          userIdP.appendChild(document.createTextNode(userData.profile.id));
          userDiv.appendChild(userIdP);

          const nameP = document.createElement("p");
          const nameStrong = document.createElement("strong");
          nameStrong.textContent = "Name: ";
          nameP.appendChild(nameStrong);
          nameP.appendChild(document.createTextNode(userData.profile.name));
          userDiv.appendChild(nameP);

          const emailP = document.createElement("p");
          const emailStrong = document.createElement("strong");
          emailStrong.textContent = "Email: ";
          emailP.appendChild(emailStrong);
          emailP.appendChild(document.createTextNode(userData.profile.email));
          userDiv.appendChild(emailP);

          const companyP = document.createElement("p");
          const companyStrong = document.createElement("strong");
          companyStrong.textContent = "Company: ";
          companyP.appendChild(companyStrong);
          companyP.appendChild(document.createTextNode(userData.profile.company || "Not specified"));
          userDiv.appendChild(companyP);

          const planP = document.createElement("p");
          const planStrong = document.createElement("strong");
          planStrong.textContent = "Plan: ";
          planP.appendChild(planStrong);
          planP.appendChild(document.createTextNode(userData.profile.plan || "Unknown"));
          userDiv.appendChild(planP);

          const timezoneP = document.createElement("p");
          const timezoneStrong = document.createElement("strong");
          timezoneStrong.textContent = "Timezone: ";
          timezoneP.appendChild(timezoneStrong);
          timezoneP.appendChild(document.createTextNode(userData.profile.timezone || "Not specified"));
          userDiv.appendChild(timezoneP);
        } else {
          userDiv.textContent = "";
          const noUserP = document.createElement("p");
          noUserP.textContent = "No user information available";
          userDiv.appendChild(noUserP);
        }
      }

      // Display blueprint devices information
      function displayBlueprintInfo(devices) {
        const blueprintDiv = document.getElementById("blueprint-info");
        if (devices && devices.length > 0) {
          blueprintDiv.textContent = "";

          // Create elements instead of using innerHTML
          const countP = document.createElement("p");
          const countStrong = document.createElement("strong");
          countStrong.textContent = "Blueprint Devices Count: ";
          countP.appendChild(countStrong);
          countP.appendChild(document.createTextNode(devices.length));
          blueprintDiv.appendChild(countP);

          const devicesList = document.createElement("ul");
          devices.forEach((device) => {
            const li = document.createElement("li");

            const deviceNameStrong = document.createElement("strong");
            deviceNameStrong.textContent = device.name;
            li.appendChild(deviceNameStrong);
            li.appendChild(document.createTextNode(` (ID: ${device.id})`));
            li.appendChild(document.createElement("br"));

            li.appendChild(document.createTextNode(`Type: ${device.type || "Unknown"}`));
            li.appendChild(document.createElement("br"));

            li.appendChild(document.createTextNode(`Active: ${device.active ? "Yes" : "No"}`));

            devicesList.appendChild(li);
          });
          blueprintDiv.appendChild(devicesList);
        } else {
          blueprintDiv.textContent = "";
          const noBlueprintP = document.createElement("p");
          noBlueprintP.textContent = "No blueprint devices available";
          blueprintDiv.appendChild(noBlueprintP);
        }
      }

      // Refresh user information
      function refreshUserInfo() {
        document.getElementById("user-info").textContent = "Refreshing user information...";
        // The onSyncUserInformation callback will be triggered automatically
        // This is just for demonstration - normally you don't need to manually refresh
        if (userInfo) {
          displayUserInfo(userInfo);
        }
      }

      // Refresh blueprint devices
      function refreshBlueprints() {
        document.getElementById("blueprint-info").textContent = "Refreshing blueprint information...";
        // The onSyncBlueprintDevices callback will be triggered automatically
        // This is just for demonstration - normally you don't need to manually refresh
        if (blueprintDevices) {
          displayBlueprintInfo(blueprintDevices);
        }
      }

      // Handle errors
      window.TagoIO.onError(function (error) {
        console.error("Widget error:", error);
        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent = "Error: " + (error.message || "Unknown error");
      });

      // Initialize widget
      window.TagoIO.ready({
        header: { color: "#9C27B0" },
      });
    </script>
  </body>
</html>

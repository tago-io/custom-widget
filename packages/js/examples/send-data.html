<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Send Data Widget</title>
    <script type="text/javascript" src="https://admin.tago.io/dist/custom-widget.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .form-group {
        margin: 10px 0;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .form-group input,
      .form-group select {
        width: 200px;
        padding: 5px;
      }
      button {
        padding: 10px 15px;
        margin: 5px;
        cursor: pointer;
      }
      .success {
        color: green;
        padding: 10px;
        background: #f0fff0;
        margin: 10px 0;
      }
      .error {
        color: red;
        padding: 10px;
        background: #fff0f0;
        margin: 10px 0;
      }
      .status {
        padding: 10px;
        margin: 10px 0;
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <h1>Send Data Widget</h1>
    <p>Demonstrates sending data to TagoIO devices.</p>

    <div id="status" class="status">Widget ready</div>
    <div id="message" style="display: none"></div>

    <h3>Send Single Data Point</h3>
    <div class="form-group">
      <label>Variable Name:</label>
      <input type="text" id="single-variable" value="temperature" />
    </div>
    <div class="form-group">
      <label>Value:</label>
      <input type="number" id="single-value" value="25.5" />
    </div>
    <div class="form-group">
      <label>Unit:</label>
      <input type="text" id="single-unit" value="°C" />
    </div>
    <button onclick="sendSingleData()">Send Single Data</button>

    <h3>Send Multiple Data Points</h3>
    <div class="form-group">
      <label>Temperature:</label>
      <input type="number" id="multi-temp" value="23.1" />
    </div>
    <div class="form-group">
      <label>Humidity:</label>
      <input type="number" id="multi-humidity" value="65" />
    </div>
    <div class="form-group">
      <label>Pressure:</label>
      <input type="number" id="multi-pressure" value="1013.25" />
    </div>
    <button onclick="sendMultipleData()">Send Multiple Data</button>

    <h3>Send with Location</h3>
    <div class="form-group">
      <label>Variable:</label>
      <input type="text" id="location-variable" value="location_check" />
    </div>
    <div class="form-group">
      <label>Latitude:</label>
      <input type="number" id="latitude" value="40.7128" step="any" />
    </div>
    <div class="form-group">
      <label>Longitude:</label>
      <input type="number" id="longitude" value="-74.0060" step="any" />
    </div>
    <button onclick="sendLocationData()">Send with Location</button>

    <script>
      /**
       * Send Data Example
       * Demonstrates sending data to TagoIO devices using sendData method
       */

      let widgetConfig = null;

      // Handle widget startup
      window.TagoIO.onStart(function (widget) {
        console.log("Send Data Widget started:", widget);
        widgetConfig = widget;
        document.getElementById("status").textContent =
          "Widget ready - configured with " + widget.display.variables.length + " variables";
      });

      // Send single data point
      function sendSingleData() {
        const variable = document.getElementById("single-variable").value;
        const value = document.getElementById("single-value").value;
        const unit = document.getElementById("single-unit").value;

        if (!variable || !value) {
          showMessage("Please fill in variable name and value", "error");
          return;
        }

        const data = [
          {
            variable: variable,
            value: parseFloat(value),
            unit: unit || undefined,
            time: new Date().toISOString(),
          },
        ];

        showMessage("Sending single data point...", "status");

        window.TagoIO.sendData(data)
          .then(function (result) {
            console.log("Data sent successfully:", result);
            showMessage("Single data point sent successfully!", "success");
          })
          .catch(function (error) {
            console.error("Error sending data:", error);
            showMessage("Error sending data: " + error.message, "error");
          });
      }

      // Send multiple data points
      function sendMultipleData() {
        const temp = document.getElementById("multi-temp").value;
        const humidity = document.getElementById("multi-humidity").value;
        const pressure = document.getElementById("multi-pressure").value;

        const data = [];
        const timestamp = new Date().toISOString();

        if (temp) {
          data.push({
            variable: "temperature",
            value: parseFloat(temp),
            unit: "°C",
            time: timestamp,
          });
        }

        if (humidity) {
          data.push({
            variable: "humidity",
            value: parseFloat(humidity),
            unit: "%",
            time: timestamp,
          });
        }

        if (pressure) {
          data.push({
            variable: "pressure",
            value: parseFloat(pressure),
            unit: "hPa",
            time: timestamp,
          });
        }

        if (data.length === 0) {
          showMessage("Please fill in at least one value", "error");
          return;
        }

        showMessage("Sending multiple data points...", "status");

        window.TagoIO.sendData(data)
          .then(function (result) {
            console.log("Multiple data sent successfully:", result);
            showMessage(`${data.length} data points sent successfully!`, "success");
          })
          .catch(function (error) {
            console.error("Error sending multiple data:", error);
            showMessage("Error sending data: " + error.message, "error");
          });
      }

      // Send data with location
      function sendLocationData() {
        const variable = document.getElementById("location-variable").value;
        const lat = document.getElementById("latitude").value;
        const lng = document.getElementById("longitude").value;

        if (!variable || !lat || !lng) {
          showMessage("Please fill in all location fields", "error");
          return;
        }

        const data = [
          {
            variable: variable,
            value: "Location data",
            location: {
              lat: parseFloat(lat),
              lng: parseFloat(lng),
            },
            time: new Date().toISOString(),
          },
        ];

        showMessage("Sending location data...", "status");

        window.TagoIO.sendData(data)
          .then(function (result) {
            console.log("Location data sent successfully:", result);
            showMessage("Location data sent successfully!", "success");
          })
          .catch(function (error) {
            console.error("Error sending location data:", error);
            showMessage("Error sending data: " + error.message, "error");
          });
      }

      // Show message to user
      function showMessage(text, type) {
        const messageDiv = document.getElementById("message");
        messageDiv.style.display = "block";
        messageDiv.className = type;
        messageDiv.textContent = text;

        if (type === "success" || type === "error") {
          setTimeout(() => {
            messageDiv.style.display = "none";
          }, 3000);
        }
      }

      // Handle errors
      window.TagoIO.onError(function (error) {
        console.error("Widget error:", error);
        showMessage("Widget error: " + (error.message || "Unknown error"), "error");
      });

      // Initialize widget
      window.TagoIO.ready({
        header: { color: "#FF9800" },
      });
    </script>
  </body>
</html>

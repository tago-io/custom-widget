name: Deploy to GitHub Pages

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Assemble site
        run: |
          mkdir -p _site/dist _site/examples
          cp packages/js/dist/custom-widget.js    _site/dist/
          cp packages/js/dist/custom-widget.min.js _site/dist/
          cp packages/js/dist/custom-widget.css    _site/dist/
          cp packages/js/dist/custom-widget.min.css _site/dist/
          cp packages/js/examples/*.html           _site/examples/
          # Guarded: a missing dashboard artifact must not fail the whole release job.
          test -f packages/dashboard/dist/custom-dashboard.js && cp packages/dashboard/dist/custom-dashboard.js _site/dist/ || true
          test -f packages/dashboard/dist/custom-dashboard.min.js && cp packages/dashboard/dist/custom-dashboard.min.js _site/dist/ || true
          # Flat alongside the widget examples, not in a subdirectory: each dashboard example
          # loads the bundle with a relative ../dist/ path, which only resolves to _site/dist/
          # from this depth. No filename collides with packages/js/examples.
          ls packages/dashboard/examples/*.html >/dev/null 2>&1 && cp packages/dashboard/examples/*.html _site/examples/ || true

      - uses: actions/upload-pages-artifact@v3

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

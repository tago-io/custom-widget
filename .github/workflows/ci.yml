name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Lint & Format
        run: pnpm check

      # `vp check` covers lint and format only, and tsup typechecks src/ on its way to the .d.ts.
      # Nothing was checking tests/, so a type-level assertion in a test could not fail the build.
      - name: Typecheck
        run: pnpm -r check:types

      - name: Test
        run: pnpm vp test run
